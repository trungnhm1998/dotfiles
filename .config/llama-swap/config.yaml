# llama-swap — Main PC (P1). Single model: Qwen3.6-35B-A3B uncensored (HauhauCS Aggressive Q6_K_P).
# -c 262144: the model's native max context; past this needs YaRN rope scaling and quality drops.
# --fit on: llama.cpp places layers/MoE experts across VRAM and RAM for that context itself;
#   --fit-target keeps ~1.5 GB VRAM free for the desktop.
# --chat-template-file: the model's own template, patched to render mid-conversation system messages
#   instead of raising; Claude Code sends them and the stock template 500s.
# --parallel 1: single-user; avoids the default 4x KV-slot over-allocation.
# Do NOT add --no-mmap: under file-cache pressure it pages CPU experts to swap (decode 48 -> 7 tok/s).
# Previous fast/big/tab entries live in git history (52b7695); their model files were removed.
healthCheckTimeout: 300

models:
  "uncensored":
    cmd: >
      H:\llm\llama.cpp\llama-server.exe
      -m H:\llm-models\Qwen3.6-35B-A3B-Uncensored-Q6_K_P.gguf
      --port ${PORT} --fit on --fit-target 1536 --parallel 1
      --jinja --chat-template-file C:\Users\mint\dotfiles\.config\llama-swap\qwen3.6-uncensored.jinja
      -fa on -c 262144 --cache-type-k q8_0 --cache-type-v q8_0
    ttl: 900
