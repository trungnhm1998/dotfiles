// Battlefield 6 console cvars. Managed by dotfiles: .config/bf6/user.cfg
// Design: docs/specs/2026-07-31-bf6-competitive-config-design.md
//
// DELIBERATELY ABSENT - do not re-add:
//   Thread.ProcessorCount / Thread.MaxProcessorCount / Thread.MinFreeProcessorCount
//   GstRender.Thread.MaxProcessorCount
//     The widely-copied "pro config" thread pin. Caps the Frostbite job pool; on a
//     24-thread CPU it trades average FPS and frametime consistency for stutter.
//   RenderDevice.ForceRenderAheadLimit
//     Reflex owns render queue depth. Setting both is redundant at best.

// FPS readout: top-right, a single number, nothing else.
//
// The three zeros below are TUNED AND CONFIRMED WORKING (Max, 2026-07-31), not
// untouched defaults. Format 0 renders a bare number and offsets 0,0 land it in
// the top-right corner, so no adjustment was needed. Do not "fix" them.
//
// This is the console-cvar path. GstRender.PerformanceOverlay in PROFSAVE is a
// SEPARATE in-game overlay and is deliberately held at 0 by bf6-settings.ps1 so
// the two do not stack. Turning it on in the menu would draw a second, larger
// block on top of this number.
PerfOverlay.DrawFPS 1
PerfOverlay.DrawGPU 0
PerfOverlay.DrawSim 0
PerfOverlay.drawpixelthroughput 0
PerfOverlay.fpsdisplayformat 0
PerfOverlay.FpsDisplayOffsetX 0
PerfOverlay.FpsDisplayOffsetY 0

// Clarity
WorldRender.MotionBlurEnable 0
postprocess.dofmethod 0
Render.DrawScreenInfo 0
